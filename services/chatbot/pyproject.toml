[project]
name = "chatbot"
version = "0.1.0"
description = "Retail data analysis chatbot service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "sse-starlette>=3.5.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot-cli = "chatbot.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
