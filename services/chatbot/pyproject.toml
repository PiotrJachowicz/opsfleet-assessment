[project]
name = "chatbot"
version = "0.1.0"
description = "Retail data analysis chatbot service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "google-cloud-bigquery>=3.46.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "sqlglot>=30.21.0",
    "sse-starlette>=3.5.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["tests", "."]
testpaths = ["tests"]

