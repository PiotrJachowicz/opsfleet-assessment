[project]
name = "chat-cli"
version = "0.1.0"
description = "CLI client for the retail data analysis chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
chat-cli = "chat_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
