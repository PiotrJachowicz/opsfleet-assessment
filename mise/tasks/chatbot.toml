[chatbot-setup]
description = "Install chatbot service dependencies"
dir = "{{config_root}}/services/chatbot"
run = "uv sync"

[migrate]
description = "Apply Alembic migrations"
dir = "{{config_root}}/services/chatbot"
run = "uv run alembic upgrade head"

["migrate:rev"]
description = "Autogenerate Alembic revision (pass -- -m 'msg')"
dir = "{{config_root}}/services/chatbot"
run = "uv run alembic revision --autogenerate"

[chatbot]
description = "Run chatbot Starlette service"
dir = "{{config_root}}/services/chatbot"
depends = ["chatbot-setup"]
run = "uv run uvicorn chatbot.app:app --host 127.0.0.1 --port 8000 --log-level info"

[dev]
description = "Start infra, migrate, and run chatbot with reload"
depends = ["infra:up", "migrate"]
dir = "{{config_root}}/services/chatbot"
run = "uv run uvicorn chatbot.app:app --host 127.0.0.1 --port 8000 --reload"

[chat]
description = "Interactive chatbot CLI (server must already be running)"
dir = "{{config_root}}/services/chatbot"
run = "uv run chatbot-cli"
